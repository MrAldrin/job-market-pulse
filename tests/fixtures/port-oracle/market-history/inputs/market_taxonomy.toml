# Market taxonomy for deterministic role-family and term counts.
# Patterns are case-insensitive regular expressions (Python re syntax).
# Literal strings ('...') avoid escaping. Bump `version` on any rule change;
# counts from different versions are not comparable unless re-recorded.
#
# Classification order (see src/lib/server/market/taxonomy.ts and docs/pipeline/market.md):
# 0. Excluded titles (excluded_titles below): other. Checked before families.
# 1. Title families matching the title. Two core data families (data_science,
#    data_engineering, analytics_bi) matching together mean mixed_data.
# 2. One title family: that family. Several: text hits decide; ties use the
#    order below.
# 3. No specific title family: generic data title (mixed_data), else text
#    fallback (needs text_min_hits), else other.

version = "2026.10-v5"

# Academic posts (PhD, postdoc, fellowships) are not tech/data job roles here.
# Title patterns only. Matching ads are family "other"; their terms still count.
excluded_titles = [
  '\bph\.?d\b',
  '\bpostdo(c|k)\w*',
  '\bstipendiat\w*',
  '\bresearch\s+fellows?\b',
  # Sales titles mentioning AI are not tech roles.
  '\w*selger\w*',
  '\bsales\b',
]

[settings]
enabled = true
# Text-only fallback needs at least this many matching text patterns.
text_min_hits = 2

[[families]]
key = "design"
label = "Design (UX/UI/graphic)"
title = [
  '\w*designer\w*',
  '\bdesign\w*(?!\s*[-/]?\s*(engineer\w*|ingeniør\w*|system\w*))',
  '\bgrafisk\w*',
  '\b(ux|ui)\b(?![\s/-]*(utvikler|developer|engineer|ingeniør|frontend))',
]
text = [
  '\bux\b',
  '\bui\b',
  '\bfigma\b',
  '\bbrukeropplevelse\w*',
  '\buser (experience|interface|research)\b',
  '\bgrafisk\w*',
  '\bdesign system\w*',
]

