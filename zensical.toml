[project]
site_url = "http://localhost:8000/"
site_name = "Job Market Pulse docs"
docs_dir = "."
site_dir = "site"

# Allow only the public guides, assets, contracts and code linked by contracts.
exclude_docs = """
/*
!/README.md
!/ARCHITECTURE.md
!/CONTRIBUTING.md
!/contracts/
!/docs/
!/src/
/src/*
!/src/lib/
/src/lib/*
!/src/lib/contracts/
/src/lib/contracts/*
!/src/lib/contracts/local-run.ts
!/src/lib/contracts/local-settings.ts
!/src/lib/contracts/pipeline-progress.ts
!/src/lib/contracts/snapshot.ts
/docs/background/
/docs/decisions.md
/docs/backlog.md
/docs/operations/beads.md
/docs/operations/agent-acceptance.md
/docs/operations/public-release.md
/docs/pipeline/model-connector.md
/docs/pipeline/market-history.md
"""

nav = [
  { "Start here" = "README.md" },
  { "Documentation hub" = "docs/index.md" },
  { "Quickstart" = "docs/quickstart.md" },
  { "Contribute" = "CONTRIBUTING.md" },
  { "Scope and operator consent" = "docs/scope.md" },
  { "Product goal" = "docs/product-goal.md" },
  { "Pipeline bricks" = "docs/architecture/bricks.md" },
  { "Architecture contracts" = "docs/architecture/contracts.md" },
  { "Project glossary" = "docs/architecture/glossary.md" },
  { "Module map" = "docs/architecture/module-map.md" },
  { "Pipeline" = [
    { "Follow a Pulse refresh" = "docs/pipeline/refresh-flow.md" },
    { "Fit review boundary" = "docs/pipeline/fit-contract.md" },
    { "Approximate workplace radius" = "docs/pipeline/geography.md" },
    { "Import saved personal review history" = "docs/pipeline/historical-review-import.md" },
    { "Manual approximate workplace location resolution" = "docs/pipeline/location-resolution.md" },
    { "Market counts: role families and terms" = "docs/pipeline/market.md" },
    { "NAV job feed: access and implementation guide" = "docs/pipeline/nav-feed.md" },
    { "Local NAV reader" = "docs/pipeline/nav-reader.md" },
    { "Local observation history" = "docs/pipeline/observations.md" },
    { "Offline personal pipeline" = "docs/pipeline/personal-pipeline.md" },
    { "Pipeline seams" = "docs/pipeline/pipeline-seams.md" },
    { "Private profiles" = "docs/pipeline/profiles.md" },
    { "Deterministic relevance evidence" = "docs/pipeline/relevance.md" },
  ] },
  { "Alert" = [
    { "Local delivery outbox and channel interface" = "docs/alert/delivery.md" },
    { "Quiet digest selection" = "docs/alert/digest.md" },
  ] },
  { "Dashboard" = [
    { "Local dashboard" = "docs/dashboard/new-dashboard.md" },
    { "Optional phone view" = "docs/dashboard/phone-view.md" },
    { "UI overview" = "docs/dashboard/ui-overview.md" },
  ] },
  { "Review" = [
    { "Personal review" = "docs/review/hand-run-review.md" },
    { "Review feedback and calibration" = "docs/review/review-feedback.md" },
  ] },
  { "Operations" = [
    { "Setup wizard" = "docs/operations/setup-wizard.md" },
    { "NAV access before your first refresh" = "docs/operations/source-access.md" },
    { "Manual operations" = "docs/operations/operations.md" },
    { "Publish a phone snapshot" = "docs/operations/phone-snapshots.md" },
    { "Railway deployment" = "docs/operations/railway.md" },
    { "Scheduled refresh" = "docs/operations/weekly-automation.md" },
    { "Local one-command pipeline" = "docs/operations/local-pipeline.md" },
    { "Pulse CLI" = "docs/operations/short-cli.md" },
  ] },
]

[project.theme]
language = "en"
logo = "docs/assets/logo.svg"
favicon = "docs/assets/favicon.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
